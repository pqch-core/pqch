# Torneira da testnet PQCH: https://faucet-testnet.pqch.org -> faucet.py (127.0.0.1:3010).
# Os limites de moedas (1 por endereço e por IP a cada 24 h, teto diário) estão no faucet.py;
# aqui só se trava o excesso de pedidos.
limit_req_zone $binary_remote_addr zone=pqch_faucet:10m rate=2r/s;

server {
    listen 80;
    server_name faucet-testnet.pqch.org;
    location /.well-known/acme-challenge/ { root /var/www/pqch-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name faucet-testnet.pqch.org;
    ssl_certificate     /etc/letsencrypt/live/faucet-testnet.pqch.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faucet-testnet.pqch.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 4k;

    location = / {
        limit_req zone=pqch_faucet burst=10 nodelay;
        limit_req_status 429;
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
    }
    location / { return 404; }
}
