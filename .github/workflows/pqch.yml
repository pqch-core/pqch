# PQCH continuous integration: Linux only, to keep within a private repository's Actions budget.
#   build-test   pushes to main and pull requests: build with the wallet, unit tests, wallet validation,
#                and the essential functional tests.
#   sanitizers   pull requests and pushes to main: unit tests with ASan + UBSan (clang).
#   fuzz         pull requests and pushes to main: the PQCH fuzz targets and the wallet's descriptor targets, one minute each.
#   tsan         weekly and by hand: unit tests with ThreadSanitizer.
# The inherited Bitcoin Core matrix (ci.yml) only runs by hand.
#
# Pull requests from forks ALWAYS run on GitHub's runners, never on the project's own runner: their
# code is untrusted and the self-hosted runner sits in the team's network (RUNNER.md).
#
# Where the jobs run: the repository variable PQCH_RUNS_ON (Settings > Secrets and variables >
# Actions > Variables), a JSON label list such as ["self-hosted","linux","x64","pqch"] for the
# project's own runner (contrib/pqch/RUNNER.md). Without it, GitHub's ubuntu-24.04 runners.
# On a self-hosted runner the packages are installed once by contrib/pqch/instalar_runner.sh and
# ccache lives in the runner's home directory.

name: PQCH CI
# Pushes and pull requests that only change documentation, the Android app (its own workflow) or the
# faucet do not start a run, so they neither use the runner for 80 minutes nor cancel a run in
# progress.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'contrib/pqch/android/**'
      - 'contrib/pqch/torneira/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'contrib/pqch/android/**'
      - 'contrib/pqch/torneira/**'
  schedule:
    - cron: '17 3 * * 1'  # Mondays 03:17 UTC (TSan)
  workflow_dispatch:

concurrency:
  group: pqch-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEPS: build-essential cmake pkgconf python3 libevent-dev libboost-dev libsqlite3-dev ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M

jobs:
  build-test:
    name: 'Build and test'
    if: github.event_name != 'schedule'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install packages
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS
      - name: ccache in the runner's home (self-hosted)
        if: runner.environment == 'self-hosted'
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: .ccache
          key: ccache-release-${{ github.sha }}
          restore-keys: ccache-release-
      - name: Configure
        run: cmake -B build -DENABLE_WALLET=ON -DENABLE_IPC=OFF -DBUILD_GUI=OFF -DWITH_CCACHE=ON
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Unit tests
        run: ctest --test-dir build -j$(nproc) --timeout 1800 --output-on-failure
      - name: Wallet validation (regtest, 2 nodes)
        run: contrib/pqch/validar_carteira.sh build
      - name: Functional tests (essential set)
        run: |
          # One test per 3 GB of memory (each PQCH node holds ~0.5 GB of RandomX state, a test runs up
          # to 4 nodes), never more than the cores: with --jobs=$(nproc) the kernel killed nodes for
          # lack of memory and tests failed with "no peers" (feature_bip68_sequence.py, 15 nov. 2026).
          JOBS=$(awk -v c="$(nproc)" '/MemTotal/ {j=int($2/1024/1024/3); if (j<1) j=1; if (j>c) j=c; print j}' /proc/meminfo)
          echo "Functional tests in parallel: ${JOBS}"
          build/test/functional/test_runner.py --jobs="${JOBS}" --timeout-factor=4 \
            mempool_accept.py rpc_blockchain.py mining_basic.py mempool_limit.py \
            feature_nulldummy.py feature_utxo_set_hash.py p2p_invalid_tx.py p2p_invalid_block.py \
            p2p_invalid_messages.py rpc_validateaddress.py p2p_segwit.py \
            feature_coinstatsindex.py rpc_getblockstats.py feature_bip68_sequence.py p2p_ibd_stalling.py \
            wallet_pqch_locked.py wallet_pqch_recovery.py rpc_help.py wallet_crosschain.py feature_init.py \
            feature_config_args.py wallet_pqch_lightwallet.py \
            wallet_basic.py wallet_send.py wallet_sendall.py wallet_importdescriptors.py rpc_psbt.py \
            feature_pqch_mldsa_emergency.py mining_pqch_getblocktemplate.py p2p_initial_headers_sync.py \
            feature_pqch_header_checkpoints.py mempool_truc.py wallet_v3_txs.py

  sanitizers:
    name: 'ASan + UBSan'
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 240
    env:
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
      LSAN_OPTIONS: suppressions=${{ github.workspace }}/test/sanitizer_suppressions/lsan
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/ubsan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install packages
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS clang
      - name: ccache in the runner's home (self-hosted)
        if: runner.environment == 'self-hosted'
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: .ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure
        run: |
          cmake -B build -DSANITIZERS=address,undefined -DCMAKE_BUILD_TYPE=Debug -DENABLE_WALLET=ON -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DWITH_CCACHE=ON
      - name: Build
        run: cmake --build build -j$(nproc) --target test_bitcoin
      - name: Unit tests
        # Only test_bitcoin is built: skip the univalue and secp256k1 suites.
        run: ctest --test-dir build -E "univalue|secp256k1|DISCOVERY_FAILURE" -j$(nproc) --timeout 3600 --output-on-failure

  fuzz:
    name: 'Fuzz (PQCH targets)'
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install packages
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS clang libclang-rt-18-dev
      - name: ccache in the runner's home (self-hosted)
        if: runner.environment == 'self-hosted'
        run: echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: .ccache
          key: ccache-fuzz-${{ github.sha }}
          restore-keys: ccache-fuzz-
      - name: Configure
        run: cmake --preset=libfuzzer -DENABLE_WALLET=ON -DBUILD_GUI=OFF -DENABLE_IPC=OFF -DWITH_CCACHE=ON
      - name: Build
        run: cmake --build build_fuzz -j$(nproc)
      - name: Fuzz
        run: |
          for t in pqch_auxpow_header pqch_auxpow_monero_block pqch_monero_primitives pqch_pq_verify pqch_p2mr_descriptor pqch_bip39 headers_sync_state psbt mocked_descriptor_parse scriptpubkeyman; do
            mkdir -p corpus/$t
            echo "::group::$t"
            FUZZ=$t build_fuzz/bin/fuzz -max_total_time=60 -timeout=20 -rss_limit_mb=3000 corpus/$t
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            leak-*

  tsan:
    name: 'TSan'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '"ubuntu-24.04"' || vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 300
    env:
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/test/sanitizer_suppressions/tsan
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install packages
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $DEPS clang
      - name: Configure
        run: |
          cmake -B build -DSANITIZERS=thread -DCMAKE_BUILD_TYPE=Debug -DENABLE_WALLET=ON -DENABLE_IPC=OFF \
            -DBUILD_GUI=OFF -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build -j$(nproc) --target test_bitcoin
      - name: Unit tests
        # Only test_bitcoin is built: skip the univalue and secp256k1 suites.
        run: ctest --test-dir build -E "univalue|secp256k1|DISCOVERY_FAILURE" -j$(nproc) --timeout 3600 --output-on-failure
