# PQCH: the Android light wallet (contrib/pqch/CARTEIRA-LEVE.md). Builds the core (libpqchwallet.so)
# with the NDK for phones (arm64-v8a) and the emulator (x86_64), then the test APK, and keeps it as
# the run's artifact "pqch-wallet-apk" (with its SHA256).
#
# Runs where the other PQCH jobs run (repository variable PQCH_RUNS_ON). On the self-hosted runner the
# Android SDK, NDK and Gradle are downloaded once into the runner's tool cache (about 4 GB), and the
# test APK is signed with the runner's debug key (~/.android/debug.keystore), the same for every build,
# so a new test APK installs over the previous one.
#
# Release ("Run workflow" with "release" ticked and a version): builds the release APK UNSIGNED and
# zip-aligned. It is signed afterwards on the release PC with the release key, which lives only on
# the USB pens and never reaches the runner (contrib/pqch/CARTEIRA-LEVE.md, "Assinar uma versão").

name: PQCH Android wallet
on:
  push:
    branches: [main]
    paths:
      - 'contrib/pqch/android/**'
      - 'src/pqchwallet/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release APK (unsigned, to be signed with the release key)'
        type: boolean
        default: false
      version:
        description: 'Release version name, e.g. 0.3.0 (release only)'
        type: string
        default: ''

concurrency:
  group: pqch-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  NDK_VERSION: 27.2.12479018
  ANDROID_API: 35

jobs:
  apk:
    name: 'Test APK'
    runs-on: ${{ fromJSON(vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: ''
      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;35.0.0" "ndk;${NDK_VERSION}" >/dev/null
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.11.1'
      - name: Core library (NDK)
        run: contrib/pqch/android/build-core.sh arm64-v8a x86_64
      - name: Version
        id: v
        env:
          RELEASE: ${{ inputs.release == true }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "${RELEASE}" == true ]]; then
            [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 0.3.0"; exit 1; }
            echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "file=pqch-wallet-${VERSION}-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "src=release/app-release-unsigned.apk" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.1.${{ github.run_number }}-test" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "file=pqch-wallet-0.1.${{ github.run_number }}-test.apk" >> "$GITHUB_OUTPUT"
            echo "src=debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          fi
      - name: APK
        working-directory: contrib/pqch/android
        env:
          PQCH_APP_VERSION_CODE: ${{ github.run_number }}
          PQCH_APP_VERSION_NAME: ${{ steps.v.outputs.name }}
        run: gradle --no-daemon ${{ steps.v.outputs.task }}
      - name: Name and checksum
        env:
          SRC: contrib/pqch/android/app/build/outputs/apk/${{ steps.v.outputs.src }}
          FILE: ${{ steps.v.outputs.file }}
        run: |
          mkdir -p out
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/35.0.0/zipalign"
          if [[ "${FILE}" == *-unsigned.apk ]] && ! "${ZIPALIGN}" -c -P 16 4 "${SRC}" >/dev/null; then
            # Align before signing (aligning a signed APK would break its signature).
            "${ZIPALIGN}" -P 16 -f 4 "${SRC}" "out/${FILE}"
          else
            cp "${SRC}" "out/${FILE}"
          fi
          "${ZIPALIGN}" -c -P 16 4 "out/${FILE}"
          (cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pqch-wallet-apk
          path: out/
          retention-days: 30
