# PQCH release builds: PQCH Core (GUI + node) for Linux x86_64 and Windows x64, built with the
# depends system (pinned, hash-checked sources) on the project's own runner.
#
#   tag vX.Y.Z  ->  build, SHA256SUMS, and a *draft* GitHub release with the files (nothing at all when
#                   that release already exists: publishing a draft creates its tag)
#   Run workflow (by hand)  ->  build and SHA256SUMS as an Actions artifact only (version dev-<commit>)
#   Run workflow with "release" ticked  ->  as a tag: version from CMakeLists.txt and a *draft* release
#     v<version> on this commit. GitHub creates the tag only when the draft is published.
#
# Nothing is signed here: the runner holds no keys. The release manager downloads SHA256SUMS,
# checks it, signs it on their own computer (contrib/pqch/RELEASE.md) and adds SHA256SUMS.asc.
# macOS comes after launch.
#
# Where the jobs run: the repository variable PQCH_RUNS_ON, as in pqch.yml. The first build of
# each platform compiles Qt and takes 1-2 hours; later ones reuse the depends cache in the
# runner's home directory.

name: PQCH Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Draft release v<version in CMakeLists.txt> from this commit'
        type: boolean
        default: false

concurrency:
  group: pqch-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Publishing a draft creates its tag, and the tag starts this workflow again. When that release
  # already exists there is nothing to build: stop here instead of compiling for an hour.
  precheck:
    name: 'Release already published?'
    runs-on: ${{ fromJSON(vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]] && command -v gh >/dev/null \
             && gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists (published from a draft); nothing to build."
            skip=true
          fi
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

  build:
    name: 'Build ${{ matrix.name }}'
    needs: precheck
    if: needs.precheck.outputs.skip != 'true'
    runs-on: ${{ fromJSON(vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    timeout-minutes: 600
    strategy:
      fail-fast: false
      max-parallel: 1  # one runner: one platform at a time
      matrix:
        include:
          - name: x86_64-linux-gnu
            host: x86_64-pc-linux-gnu
          - name: win64
            host: x86_64-w64-mingw32
    steps:
      # The runner keeps its workspace between runs. A sparse checkout from an earlier job stayed in
      # it and the build saw only three files ("make: *** depends: No such file or directory"), even
      # after "git sparse-checkout disable". Start from an empty folder: a depth-1 clone is quick, and
      # the depends and ccache caches live in the runner's home, not here.
      - name: Empty the workspace (self-hosted runner)
        run: find . -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check the checkout is complete
        run: |
          if [[ ! -f depends/Makefile ]]; then
            echo "::error::Incomplete checkout: depends/Makefile is missing"
            git config --list --show-origin | grep -i -E "sparse|worktree" || true
            exit 1
          fi

      - name: Version
        id: version
        run: |
          v() { sed -n "s/^set(CLIENT_VERSION_$1 \([0-9]*\)).*/\1/p" CMakeLists.txt; }
          CMAKE_VERSION="$(v MAJOR).$(v MINOR).$(v BUILD)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${VERSION}" != "${CMAKE_VERSION}"* ]]; then
              echo "::error::Tag v${VERSION} does not match the version in CMakeLists.txt (${CMAKE_VERSION})."
              exit 1
            fi
          elif [[ "${{ inputs.release }}" == "true" ]]; then
            VERSION="${CMAKE_VERSION}"
          else
            VERSION="dev-${GITHUB_SHA::10}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "PQCH ${VERSION} (${{ matrix.name }})"

      - name: Packages (GitHub-hosted runner only)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkgconf python3 \
            ccache bison byacc gperf curl xz-utils g++-mingw-w64-x86-64-posix nsis zip

      - name: Caches in the runner's home (self-hosted)
        run: |
          if [[ "${{ runner.environment }}" == "self-hosted" ]]; then base="$HOME/pqch-release-cache"; else base="$RUNNER_TEMP/pqch-release-cache"; fi
          mkdir -p "$base/sources" "$base/built" "$base/ccache"
          {
            echo "SOURCES_PATH=$base/sources"
            echo "BASE_CACHE=$base/built"
            echo "CCACHE_DIR=$base/ccache"
            echo "CCACHE_MAXSIZE=2G"
          } >> "$GITHUB_ENV"

      - name: Check the tools
        run: |
          for t in make cmake curl ccache bison; do command -v "$t" >/dev/null || { echo "::error::$t is missing (contrib/pqch/instalar_runner.sh)"; exit 1; }; done
          if [[ "${{ matrix.host }}" == *mingw32 ]]; then
            command -v x86_64-w64-mingw32-g++-posix >/dev/null || { echo "::error::g++-mingw-w64-x86-64-posix is missing"; exit 1; }
            command -v makensis >/dev/null || { echo "::error::nsis is missing"; exit 1; }
            command -v zip >/dev/null || { echo "::error::zip is missing"; exit 1; }
          fi

      - name: Dependencies (depends, sources checked by SHA256)
        run: make -C depends HOST=${{ matrix.host }} NO_IPC=1 NO_USDT=1 -j"$(nproc)"

      - name: Configure
        run: |
          cmake -B build --toolchain "depends/${{ matrix.host }}/toolchain.cmake" \
            -DBUILD_GUI=ON -DBUILD_TESTS=ON -DBUILD_TX=ON -DBUILD_UTIL=ON -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF -DENABLE_IPC=OFF -DWITH_CCACHE=ON -DREDUCE_EXPORTS=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: PQCH unit tests (Linux)
        if: matrix.host == 'x86_64-pc-linux-gnu'
        run: build/bin/test_pqch --run_test='pqch_*' --log_level=test_suite

      # The pool miner for "Mining > Pool" (phase D of POOL.md): pqch-pool's own signed release, taken by the
      # version and SHA256 pinned in contrib/pqch/pqch-pool.sha256 (a copy of its SHA256SUMS). A separate
      # program (GPL-3.0), shipped next to pqch-qt, not linked into it.
      - name: Pool miner (pinned version and SHA256)
        run: |
          PIN=contrib/pqch/pqch-pool.sha256
          if [[ ! -f "$PIN" ]]; then echo "::warning::$PIN missing: no pool miner in this build"; exit 0; fi
          VER="$(sed -n 's/^# version //p' "$PIN")"
          if [[ "${{ matrix.host }}" == *mingw32 ]]; then F="pqch-pool-${VER}-win64.zip"; else F="pqch-pool-${VER}-x86_64-linux-gnu.tar.gz"; fi
          rm -rf pool && mkdir pool
          curl -fsSL --proto '=https' -o "pool/$F" "https://github.com/pqch-core/pqch-pool/releases/download/v${VER}/${F}"
          (cd pool && grep -E "^[0-9a-f]{64}  ${F}\$" "../$PIN" | sha256sum -c -)
          if [[ "$F" == *.zip ]]; then
            (cd pool && unzip -q "$F")
            mkdir -p build/release
            cp "pool/pqch-pool-${VER}/pqch-pool.exe" build/release/pqch-pool.exe
            cp "pool/pqch-pool-${VER}/COPYING.txt" build/release/COPYING-pqch-pool.txt
          else
            tar -C pool -xzf "pool/$F"
          fi
          echo "POOL_DIR=pool/pqch-pool-${VER}" >> "$GITHUB_ENV"

      - name: Package (Linux)
        if: matrix.host == 'x86_64-pc-linux-gnu'
        run: |
          VER="${{ steps.version.outputs.version }}"
          NAME="pqch-${VER}"
          cmake --install build --prefix "stage/${NAME}" --strip
          # tests stay out; the inherited man pages still describe Bitcoin Core
          rm -f "stage/${NAME}/bin/test_pqch"* "stage/${NAME}/libexec/test_pqch"*
          rm -rf "stage/${NAME}/share/man"
          rmdir "stage/${NAME}/libexec" "stage/${NAME}/share" 2>/dev/null || true
          cp COPYING "stage/${NAME}/COPYING"
          cp doc/README_windows.txt "stage/${NAME}/README.txt"
          install -m 755 contrib/pqch/pqch-miner.desktop contrib/pqch/pqch-miner.sh "stage/${NAME}/"
          if [[ -n "${POOL_DIR:-}" ]]; then
            install -m 755 "${POOL_DIR}/pqch-pool" "stage/${NAME}/bin/pqch-pool"
            cp "${POOL_DIR}/COPYING" "stage/${NAME}/COPYING-pqch-pool"
          fi
          mkdir -p out
          tar -C stage --owner=0 --group=0 --numeric-owner --sort=name --mtime="@$(git log -1 --format=%ct)" \
            -czf "out/${NAME}-x86_64-linux-gnu.tar.gz" "${NAME}"
          tar -tzf "out/${NAME}-x86_64-linux-gnu.tar.gz"

      - name: Package (Windows)
        if: matrix.host == 'x86_64-w64-mingw32'
        run: |
          VER="${{ steps.version.outputs.version }}"
          NAME="pqch-${VER}"
          cmake --build build --target deploy
          mkdir -p out "stage/${NAME}"
          mv build/pqch-win64-setup.exe "out/${NAME}-win64-setup.exe"
          cp build/release/pqch*.exe "stage/${NAME}/"
          [[ -f build/release/COPYING-pqch-pool.txt ]] && cp build/release/COPYING-pqch-pool.txt "stage/${NAME}/"
          cp COPYING "stage/${NAME}/COPYING.txt"
          cp doc/README_windows.txt "stage/${NAME}/README.txt"
          (cd stage && zip -X -r "../out/${NAME}-win64.zip" "${NAME}")
          unzip -l "out/${NAME}-win64.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pqch-${{ steps.version.outputs.version }}-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  sums:
    name: 'SHA256SUMS'
    needs: build
    runs-on: ${{ fromJSON(vars.PQCH_RUNS_ON || '"ubuntu-24.04"') }}
    permissions:
      contents: write  # draft release on tags
    steps:
      # Its own folder ("meta"), so the sparse checkout never touches the build jobs' workspace.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: meta
          sparse-checkout: |
            CMakeLists.txt
            contrib/pqch/release-notes.md
            contrib/pqch/pqch-releases.asc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dl
          pattern: pqch-*
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dl
          sha256sum pqch-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pqch-release-${{ github.ref_name }}-${{ github.run_number }}
          path: dl/*
          retention-days: 30
      - name: Draft release (tags, or by hand with "release" ticked)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh >/dev/null || { echo "::error::gh is missing on the runner (sudo apt-get install gh; contrib/pqch/instalar_runner.sh)"; exit 1; }
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            v() { sed -n "s/^set(CLIENT_VERSION_$1 \([0-9]*\)).*/\1/p" meta/CMakeLists.txt; }
            TAG="v$(v MAJOR).$(v MINOR).$(v BUILD)"
          fi
          # Publishing a draft creates its tag, which starts this workflow again: leave that release alone.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists (published from a draft); nothing to do."
            exit 0
          fi
          # The public release key travels with every release once it is in the repository.
          EXTRA=()
          [[ -f meta/contrib/pqch/pqch-releases.asc ]] && EXTRA+=(meta/contrib/pqch/pqch-releases.asc)
          sed "s/{{VERSION}}/${TAG#v}/g" meta/contrib/pqch/release-notes.md > notes.md
          gh release create "${TAG}" dl/* "${EXTRA[@]}" --repo "${GITHUB_REPOSITORY}" --draft --target "${GITHUB_SHA}" \
            --title "PQCH ${TAG}" --notes-file notes.md
